<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報名截止感謝頁面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #2c3e50;
      font-size: 24px;
    }
    p {
      color: #34495e;
      font-size: 18px;
      line-height: 1.6;
    }
    .notice {
      margin-top: 20px;
      font-size: 16px;
      color: #e67e22;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>報名期間已截止</h1>
    <p>感謝大家踴躍的參與！</p>
    <p>期待您下次再加入我們的活動！</p>
    <p class="notice">如有任何問題，請隨時聯繫我們。</p>
  </div>
</body>
</html>
